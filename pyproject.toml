[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nanoindent"
version = "0.1.0"
description = "FEM simulation of AFM nanoindentation of thin elastic films by a rigid spherical tip"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "nanoindent contributors" }]
keywords = ["AFM", "nanoindentation", "FEM", "contact mechanics", "Hertz", "thin film"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Physics",
    "License :: OSI Approved :: MIT License",
]

# Core dependencies. The primary FEM target is dolfinx (install via conda-forge,
# see README); scikit-fem is the pure-pip fallback and is what the default
# backend uses when dolfinx is absent.
dependencies = [
    "numpy>=1.23",
    "scipy>=1.9",
    "matplotlib>=3.6",
    "scikit-fem>=9.0",
]

[project.optional-dependencies]
test = ["pytest>=7.0", "pytest-cov>=4.0", "igor2>=0.5", "hypothesis>=6.0"]
viz = ["pyvista>=0.40", "imageio-ffmpeg>=0.4"]   # imageio-ffmpeg: MP4 animations
afm = ["igor2>=0.5"]   # Asylum Research .ibw reading
video = ["Pillow>=9.0", "imageio-ffmpeg>=0.4"]   # HS-AFM movies: TIFF reader + MP4 export
docs = ["python-docx>=1.0", "python-pptx>=1.0", "Pillow>=9.0"]   # .docx / .pptx export (examples/msnl_bio_dc_unbonded_5nm.py, model_slides.py)
tracking = ["mlflow>=2.0"]   # optional MLflow export (nanoindent.tracking.log_run_to_mlflow)
web = ["streamlit>=1.30"]   # interactive dashboard (dashboard/app.py)
# DyNaMo bilayer BEC chain (nanoindent.dynamo_v0 / dynamo_v1). lmfit drives the
# Hertz+BEC fits; pandas backs the ratio-of-variances contact-point method;
# tifffile / nptdms are needed only by the vendored readers' image and
# thermal-noise paths.
dynamo = ["lmfit>=1.2", "pandas>=1.5", "tifffile>=2023.1", "nptdms>=1.7"]
# Re-running examples/bec_dopc_chi_master_curve.ipynb. The .py alongside it is
# the authoring source; the .ipynb is generated and executed from it.
notebooks = ["jupyter>=1.0", "nbformat>=5.9", "nbconvert>=7.0", "ipykernel>=6.0"]

[project.scripts]
nanoindent-control = "nanoindent.control:main"
nanoindent-runs = "nanoindent.tracking:main"

[project.urls]
Homepage = "https://github.com/alpibrusl/afm-finite-elements"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
# Ship the vendored chain's licences and its defect register alongside the code
# they describe — dynamo_v0 is a verbatim third-party snapshot, so the
# attribution and the "do not fix anything here" note must travel with it.
"nanoindent.dynamo_v0" = ["LICENSE-*.txt", "PROVENANCE.md", "CHECKSUMS.sha256"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: physics-validation tests that run full simulations",
    "contract: cross-repo contract tests for the LIPIVERSE bridge; the live tier needs LIPIVERSE_URL",
]

[tool.coverage.run]
source = ["nanoindent"]
branch = true
omit = [
    # dynamo_v0 is a byte-for-byte vendored snapshot of the original DyNaMo
    # chain, checksum-frozen so the published tables stay reproducible. It is
    # never edited — a defect found there is forked into dynamo_v1 — so a
    # coverage figure over it measures nothing actionable, and writing tests to
    # raise it would mean touching files whose whole purpose is to be
    # untouched. Its behaviour is pinned instead by verify_integrity() and by
    # the differential tests in test_dynamo_compare.py.
    "*/nanoindent/dynamo_v0/*",
]

[tool.coverage.report]
# The gate is 80, not the 85 this repository used before the DyNaMo work
# landed, and the reason is worth stating rather than leaving as a number
# somebody lowered.
#
# 85 was calibrated on a codebase of pure computation, where every line is
# reachable from a unit test. The analysis chain added since is an
# instrument-file pipeline: dynamo_compare, dynamo_v2.extract,
# dynamo_v1.preprocessing and io.datasets all need real .jpk-force curves, and
# the dataset is 2.3 GB and lives outside the repository. Measured on a
# workstation that has it the suite reaches 82.6%; on a runner that does not,
# 81.8% — the difference being exactly those file-reading paths.
#
# So 80 is what this suite can actually achieve in CI, not a relaxation of
# standards for code that could be tested and is not. The way back up is a
# committed sample curve (~16 kB) that would let the file-reading paths run on
# a runner; until that exists, a gate above 82 would only be passable by
# excluding the untested modules from measurement, which hides the gap instead
# of closing it.
precision = 1
skip_covered = false
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
]

[tool.coverage.html]
directory = "htmlcov"
