name: Bug report
description: Something does not work as documented
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What did you expect and what did you get?
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Minimal reproduction
      description: A short script using synthetic data. Do not attach real measurement files.
      render: python
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: Environment
      placeholder: nanoindent 0.1.0, Python 3.12, macOS 15
    validations:
      required: true
