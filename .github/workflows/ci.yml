name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  fast-tests:
    name: fast tests (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}
      - name: Install (locked)
        run: uv sync --locked
      - name: Fast tests with coverage
        run: |
          uv run pytest -m "not slow" -q \
            --cov=nanoindent --cov-report=term-missing --cov-report=xml \
            --cov-fail-under=85
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: coverage-py${{ matrix.python-version }}
          path: coverage.xml

  build:
    name: build distributions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv build
